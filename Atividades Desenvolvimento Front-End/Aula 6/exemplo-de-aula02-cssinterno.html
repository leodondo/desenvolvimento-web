<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Classes e CSS Interno</title>
    <style>
        .titulo{
            color: cyan;
            text-align: center;
        }

        .caixa01{
            background-color: cadetblue;
            border: 2px solid black;
            padding: 20px;
            margin: 20px;
        }

        .caixa02{
            background-color: cadetblue;
            border: 2px solid red;
            padding: 20px;
            margin: 20px;
        }

        .destaque01{
            color: blue;
            font-weight: bold;
        }
        
        .destaque02{
            color: aquamarine;
            background-color: cornflowerblue;
            font-style: italic;
            padding: 10px;
        }
    </style>



</head>
<body>
    <h1 class="titulo">Aprendendo classes em CSS</h1>
    <div class="caixa01">
        <p>
            Estou aprendendo a utilizar classes para personalizar os elementos de um página.
        </p>
        <br>
        <p class="destaque01">
            Este parágrafo utiliza a classe destaque01
        </p>
        <p class="destaque02">
            Este parágrafo utiliza a classe destaque02
        </p>
    </div>
    <div class="caixa02">
        <p>Este parágrafo não utuliza nenhuma classe</p>
    </div>
</body>
</html>
