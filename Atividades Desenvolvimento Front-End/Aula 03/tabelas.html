<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Tabelas</title>
</head>
<body>
    <h1>Tabelas em HTML</h1>
    <p>
        As tabelas em HTML são usadas para <br>
        organizar dados em linhas e colunas.
    </p>

    <table border="1">

        <thead>
            <tr>
                <th>Nome</th>
                <th>Idade</th>
                <th>Cidade</th>

            </tr>
         </thead>
         <tbody>
            <tr>
                <td>Leonardo</td>
                <td>19</td>
                <td>Guarulhos</td>
            </tr>
            <tr>
                <td>Caíque</td>
                <td>45</td>
                <td>São Paulo</td>
            </tr>
            <tr>
                <td>Lucas</td>
                <td>26</td>
                <td>Londrina</td>
            </tr>

         </tbody>


    </table>
</body>
</html>
